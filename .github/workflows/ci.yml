name: CI

on:
    push:
    pull_request:

jobs:
    checks:
        run-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/actions-setup@v4
              width:
                  version: 10

            - uses: actions/setup-node@v4
              width:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm build
